# whackagent board hooks for a Plane board — reusable logic, board contract 2.4 (templates/BOARD.md).
# Projects never copy this file: their caller (providers/plane/whackagent-board-plane.yml, installed by /wa-setup)
# holds the triggers, permissions and concurrency, and runs this through
# `uses: rlatapy-luna/whackagent/.github/workflows/board-plane.yml@hooks-v2`. Each release moves `hooks-v2`, so
# every project runs the new logic on its next event. A change callers must follow (new trigger, permission,
# secret) needs a new caller template version (and a new tag once callers below it must keep working).
# The logic is not here: `wa-backlog hook` (providers/wa-backlog, vendored in the project as .github/board/wa-backlog)
# reads the event from the Actions environment and drives the same board adapter the agents use:
#   push to wa/<id>-<slug> holding its spec → grilled, from todo or grilling (drops the grilling claim)
#   PR → ticket                            = its wa/<id>-… branch, else the one card link in its body; every
#                                            event adds the PR as a link on the card
#   PR opened / reopened, draft or not      → review (drops the claims)
#   PR edited, link found late              → review, when the card still sits in todo/grilled
#   draft marked ready / back to draft      → ✅ comment on ready, nothing moves (already review)
#   push to an open PR while coding claimed → review (end of an agent round), new `## Feedback` rounds linked
#   push to a ticket PR, no coding claim    → reported on the PR, board untouched
#   PR merged (any base)                   → done, run report posted on the card; sprint root → Done when the
#                                            sprint has no branch and its last child is done. Stacked PR: landed
#                                            on its GitHub stack's base
#   sprint branch PR merged                → sprint root → Done (sprint landed)
#   PR closed unmerged                     → grilled, unless a coding claim or another open PR keeps the ticket going
#   schedule / manual run                  → report-only check: board vs repository, one comment per problem on the
#                                            card (resolved in place once fixed) + job summary; never moves cards.
#                                            Includes claims held with no push for WA_STALE_AFTER_HOURS (default 24)
# Same rules as board.yml for a GitHub board; no hold against a built-in tool workflow (Plane CE has none).
# Runs on a self-hosted runner next to the Plane server (Plane stays on a private network, no Actions minutes):
# label = the caller repository's variable WA_RUNNER_LABEL, default `self-hosted`. The runner needs python3 and gh,
# and must reach WA_PLANE_URL. The script comes from the default branch, never from the pushed ref: a ticket branch
# can't change the code that holds the API key. Fork pull requests never reach the runner. WA_PLANE_URL unset
# fails the run (`/wa-setup backlog` provisions it): a skipped job would read as success while no card moved.
# Settings are the caller repository's variables (`vars`), written by `wa-backlog provision`, handed over whole
# (GITHUB_TOKEN cannot list them). The Plane API key is the WA_PLANE_API_KEY secret, passed by the caller.
# Claim refs are deleted with the caller's GITHUB_TOKEN (contents: write).

name: whackagent board (Plane)

on:
  workflow_call:
    secrets:
      WA_PLANE_API_KEY:
        required: false

jobs:
  board:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.WA_RUNNER_LABEL || 'self-hosted' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/board
            .whackagent
          persist-credentials: false
      - name: wa-backlog hook
        env:
          PLANE_API_KEY: ${{ secrets.WA_PLANE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          WA_VARS: ${{ toJSON(vars) }}
          WA_PLANE_URL: ${{ vars.WA_PLANE_URL }}
        run: |
          if [ -z "$WA_PLANE_URL" ]; then
            echo "::error::WA_PLANE_URL repository variable missing: /wa-setup backlog provisions the Plane board"
            exit 1
          fi
          if [ -z "$PLANE_API_KEY" ]; then
            echo "::error::WA_PLANE_API_KEY secret missing (the caller passes it): Plane API key for the hooks"
            exit 1
          fi
          if [ ! -f .github/board/wa-backlog ]; then
            echo "::error::.github/board/wa-backlog missing on the default branch: /wa-setup backlog vendors it"
            exit 1
          fi
          python3 .github/board/wa-backlog hook
