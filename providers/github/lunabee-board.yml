# Lunabee board hooks — template version: 17 · board-contract: 3.0
# Caller only: the logic is a reusable workflow, updated through the `hooks-v3` tag, so this file changes
# only when its triggers, permissions or secrets do.
# Settings are repository variables (LB_*); LB_PROJECT_TOKEN secret = classic PAT, scopes project + repo
# (GITHUB_TOKEN can't reach Projects v2).
# Custom branch prefix? Change the `branches` filter below to match LB_BRANCH_PREFIX.

name: Lunabee board

on:
  issues:
    types: [opened, edited]
  push:
    branches: ["feature/**"]
  pull_request:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, synchronize, closed]
  # report-only board check (BOARD.md → Checks): comments what disagrees with the repository, never moves cards
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # PR and push events: event + action in the group. GitHub keeps one pending run per group and cancels the
  # older one, so a force push (synchronize) followed by `gh pr ready` (ready_for_review) would drop one of them.
  # Issue events: one group per issue, so `opened` and a quick `edited` run in order, never side by side.
  group: lunabee-board-${{ github.event.issue.number && format('issue-{0}', github.event.issue.number) || format('{0}-{1}-{2}', github.head_ref || github.ref_name, github.event_name, github.event.action) }}
  cancel-in-progress: false

jobs:
  board:
    uses: rlatapy-luna/whackagent/.github/workflows/board.yml@hooks-v3
    secrets:
      LB_PROJECT_TOKEN: ${{ secrets.LB_PROJECT_TOKEN }}
